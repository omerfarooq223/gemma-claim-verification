[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-claim-verification"
version = "1.0.0"
description = "Reliable evidence-based three-way claim verification using fine-tuned Gemma 4 with QLoRA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "M. Umar Farooq & Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==5.10.1",
    "peft==0.19.1",
    "bitsandbytes==0.50.1",
    "accelerate>=0.33.0",
    "huggingface_hub>=1.5.0,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["gradio==5.49.1", "spaces==0.51.3"]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
