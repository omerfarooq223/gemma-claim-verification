model:
  name: "google/gemma-4-12B-it"
  revision: "707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7"
  load_in_4bit: true
  quant_type: "nf4"
  double_quant: true
  compute_dtype: "float16"
  max_length: 256

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  seed: 42

  # Retained only for historical/fallback epoch-based mode.
  epochs: 2

  # Paper protocol: identical optimizer budget across all conditions.
  max_optimizer_steps: 136

  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_ratio: 0.05
  gradient_checkpointing: true
  max_grad_norm: null
  tf32: false
